<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;color:#91a9be;font:12px system-ui}#status{padding:3px 0}.error{color:#ffb4a8}.saved{color:#69e3cf}</style></head><body><div id="status" role="status" aria-live="polite">Checking saved workspace…</div><script>
const send=(type,extra={})=>window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
const emit=value=>send('streamlit:setComponentValue',{value:{event:crypto.randomUUID(),...value},dataType:'json'});
const root=window.parent;root.__simmahBackups ||= {saved:{},inflight:new Set(),boots:new Set(),retryAfter:0};const memory=root.__simmahBackups;
// Clear pre-upgrade requests that had no timeout; preserve saved browser data.
if(!memory.progress){memory.inflight.clear();memory.progress=new Map()}
let args={};const label=document.getElementById('status');
const request=r=>new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
const complete=t=>new Promise((resolve,reject)=>{t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error||new Error('Storage transaction aborted'))});
const dbPromise=new Promise((resolve,reject)=>{const r=indexedDB.open('simmah-workspace-backups-v1',1);r.onupgradeneeded=()=>{r.result.createObjectStore('metadata',{keyPath:'id'});r.result.createObjectStore('archives')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
function status(text,kind=''){label.textContent=text;label.className=kind;send('streamlit:setFrameHeight',{height:28})}
async function identity(){let id=localStorage.getItem('simmah-workspace-owner');if(!/^[a-f0-9]{32}$/.test(id||'')){id=crypto.randomUUID().replaceAll('-','');localStorage.setItem('simmah-workspace-owner',id)}return id}
async function boot(a){if(memory.boots.has(a.generation))return;memory.boots.add(a.generation);const db=await dbPromise;const records=await request(db.transaction('metadata').objectStore('metadata').getAll());emit({boot:{owner:await identity(),records,active:localStorage.getItem('simmah-workspace-active')}})}
async function save(ref,a){const key=a.owner+':'+ref.id;if(memory.inflight.has(key))return;memory.inflight.add(key);const controller=new AbortController();let timeout=setTimeout(()=>controller.abort(),30000);memory.progress.set(key,'Downloading workspace backup…');try{const db=await dbPromise;const old=await request(db.transaction('metadata').objectStore('metadata').get(ref.id));if(!old||old.digest!==ref.digest){const response=await fetch(new URL(ref.url,document.referrer),{credentials:'same-origin',cache:'no-store',signal:controller.signal});if(!response.ok)throw new Error('Backup download failed ('+response.status+')');let data;if(response.body?.getReader){if(!Number.isSafeInteger(ref.bytes)||ref.bytes<=0||ref.bytes>(a.max_backup_bytes||536870912))throw new Error('Invalid backup size');const bytes=new Uint8Array(ref.bytes);const reader=response.body.getReader();let offset=0;for(;;){const {done,value}=await reader.read();if(done)break;if(offset+value.length>bytes.length)throw new Error('Backup size exceeds expected size');bytes.set(value,offset);offset+=value.length;clearTimeout(timeout);timeout=setTimeout(()=>controller.abort(),30000);memory.progress.set(key,'Downloading workspace backup… '+Math.round(offset/ref.bytes*100)+'%')}data=bytes.buffer;if(offset!==ref.bytes)throw new Error('Incomplete backup download')}else{data=await response.arrayBuffer()}clearTimeout(timeout);if(data.byteLength!==ref.bytes)throw new Error('Incomplete backup download');memory.progress.set(key,'Verifying workspace backup…');const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',data)),v=>v.toString(16).padStart(2,'0')).join('');if(hash!==ref.digest)throw new Error('Backup verification failed');memory.progress.set(key,'Writing backup to browser storage…');const tx=db.transaction(['metadata','archives'],'readwrite'),done=complete(tx);tx.objectStore('archives').put(data,ref.token);tx.objectStore('metadata').put({...ref,url:undefined,open:true,updated:Date.now()});if(old&&old.token!==ref.token)tx.objectStore('archives').delete(old.token);await done}else if(old.revision!==ref.revision||old.token!==ref.token){const data=await request(db.transaction('archives').objectStore('archives').get(old.token));if(!data)throw new Error('Saved backup is missing');memory.progress.set(key,'Writing backup to browser storage…');const tx=db.transaction(['metadata','archives'],'readwrite'),done=complete(tx);tx.objectStore('archives').put(data,ref.token);tx.objectStore('metadata').put({...old,token:ref.token,revision:ref.revision});if(old.token!==ref.token)tx.objectStore('archives').delete(old.token);await done}memory.saved[ref.id]={token:ref.token,digest:ref.digest,revision:ref.revision};emit({saved:memory.saved});}catch(error){if(error.name==='AbortError')throw new Error('Backup download stalled for 30 seconds; retrying. Your previous saved copy is retained.');throw error}finally{clearTimeout(timeout);memory.progress.delete(key);memory.inflight.delete(key)}}
async function restore(ref,a){const key=a.generation+':'+ref.token;if(!memory.transfer||memory.transfer.key!==key){const db=await dbPromise;const raw=await request(db.transaction('archives').objectStore('archives').get(ref.token));if(!raw)throw new Error('Saved backup is missing from this browser');if(raw.byteLength!==ref.bytes||raw.byteLength>(a.max_backup_bytes||536870912))throw new Error('Invalid backup recovery size');const chunk=a.recovery_chunk_bytes||750000;memory.transfer={key,id:crypto.randomUUID(),bytes:new Uint8Array(raw),chunk,index:0,total:Math.ceil(raw.byteLength/chunk),sent:-1}}
const t=memory.transfer;if(a.upload_ack?.id===t.id)t.index=a.upload_ack.index+1;if(t.index>=t.total)return;if(t.sent!==t.index||t.generation!==a.generation){let binary='';const bytes=t.bytes.subarray(t.index*t.chunk,(t.index+1)*t.chunk);for(let i=0;i<bytes.length;i+=32768)binary+=String.fromCharCode(...bytes.subarray(i,i+32768));t.sent=t.index;t.generation=a.generation;emit({backup_part:{id:t.id,index:t.index,total:t.total,data:btoa(binary)}})}status('Restoring saved workspace… '+Math.round(t.index/t.total*100)+'%')}

async function syncOpen(a){const db=await dbPromise;const rows=await request(db.transaction('metadata').objectStore('metadata').getAll());const open=new Set(a.records.map(r=>r.id));const tx=db.transaction('metadata','readwrite'),done=complete(tx);for(const row of rows)if(row.open!==open.has(row.id))tx.objectStore('metadata').put({...row,open:open.has(row.id)});await done;if(a.active)localStorage.setItem('simmah-workspace-active',a.active);else localStorage.removeItem('simmah-workspace-active')}
async function render(a){args=a;try{if(!a.ready){status('Checking saved workspace…');await boot(a);return}if(a.restore){await restore(a.restore,a);return}if(a.restored&&memory.transfer?.id===a.restored)delete memory.transfer;await syncOpen(a);const missing=a.records.some(r=>!(a.backups||[]).some(b=>b.id===r.id));const pending=(a.backups||[]).filter(r=>memory.saved[r.id]?.digest!==r.digest||memory.saved[r.id]?.revision!==r.revision);if(a.error)status(a.error,'error');if(Date.now()<memory.retryAfter)return;if(a.busy||pending.length||missing){if(!a.error)status([...memory.progress.values()][0]||(a.busy?'Preparing workspace backup on server…':missing?'Waiting for workspace backup file…':'Starting backup download…'))}else if(!a.error)status(a.records.length?'Saved in this browser · Ready for reboot':'Workspace ready',a.records.length?'saved':'');await Promise.all(pending.map(r=>save(r,a)))}catch(error){memory.retryAfter=Date.now()+10000;if(!a.ready)memory.boots.delete(a.generation);status('Changes are not saved: '+error.message,'error');emit({error:error.message})}}
window.addEventListener('message',event=>{if(event.data?.type==='streamlit:render')render(event.data.args)});send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:28});
</script></body></html>
