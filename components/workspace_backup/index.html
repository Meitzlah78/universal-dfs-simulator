<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;color:#91a9be;font:12px system-ui}#status{padding:3px 0}.error{color:#ffb4a8}.saved{color:#69e3cf}</style></head><body><div id="status" role="status" aria-live="polite">Checking saved workspace…</div><script>
const send=(type,extra={})=>window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
const emit=value=>send('streamlit:setComponentValue',{value:{event:crypto.randomUUID(),...value},dataType:'json'});
const root=window.parent;root.__simmahBackups ||= {saved:{},inflight:new Set(),boots:new Set(),retryAfter:0};const memory=root.__simmahBackups;
let args={};const label=document.getElementById('status');
const request=r=>new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
const complete=t=>new Promise((resolve,reject)=>{t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error||new Error('Storage transaction aborted'))});
const dbPromise=new Promise((resolve,reject)=>{const r=indexedDB.open('simmah-workspace-backups-v1',1);r.onupgradeneeded=()=>{r.result.createObjectStore('metadata',{keyPath:'id'});r.result.createObjectStore('archives')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
function status(text,kind=''){label.textContent=text;label.className=kind;send('streamlit:setFrameHeight',{height:28})}
async function identity(){let id=localStorage.getItem('simmah-workspace-owner');if(!/^[a-f0-9]{32}$/.test(id||'')){id=crypto.randomUUID().replaceAll('-','');localStorage.setItem('simmah-workspace-owner',id)}return id}
async function boot(a){if(memory.boots.has(a.generation))return;memory.boots.add(a.generation);const db=await dbPromise;const records=await request(db.transaction('metadata').objectStore('metadata').getAll());emit({boot:{owner:await identity(),records,active:localStorage.getItem('simmah-workspace-active')}})}
async function save(ref,a){const key=a.owner+':'+ref.id;if(memory.inflight.has(key))return;memory.inflight.add(key);try{const db=await dbPromise;const old=await request(db.transaction('metadata').objectStore('metadata').get(ref.id));if(!old||old.digest!==ref.digest){const response=await fetch(new URL(ref.url,document.referrer),{credentials:'same-origin',cache:'no-store'});if(!response.ok)throw new Error('Backup download failed ('+response.status+')');const data=await response.arrayBuffer();if(data.byteLength!==ref.bytes)throw new Error('Incomplete backup download');const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',data)),v=>v.toString(16).padStart(2,'0')).join('');if(hash!==ref.digest)throw new Error('Backup verification failed');const tx=db.transaction(['metadata','archives'],'readwrite'),done=complete(tx);tx.objectStore('archives').put(data,ref.token);tx.objectStore('metadata').put({...ref,url:undefined,open:true,updated:Date.now()});if(old&&old.token!==ref.token)tx.objectStore('archives').delete(old.token);await done}else if(old.revision!==ref.revision||old.token!==ref.token){const data=await request(db.transaction('archives').objectStore('archives').get(old.token));if(!data)throw new Error('Saved backup is missing');const tx=db.transaction(['metadata','archives'],'readwrite'),done=complete(tx);tx.objectStore('archives').put(data,ref.token);tx.objectStore('metadata').put({...old,token:ref.token,revision:ref.revision});if(old.token!==ref.token)tx.objectStore('archives').delete(old.token);await done}memory.saved[ref.id]={token:ref.token,digest:ref.digest,revision:ref.revision};emit({saved:memory.saved});}finally{memory.inflight.delete(key)}}
async function restore(ref,a){const key=a.generation+':'+ref.token;if(!memory.transfer||memory.transfer.key!==key){const db=await dbPromise;const raw=await request(db.transaction('archives').objectStore('archives').get(ref.token));if(!raw)throw new Error('Saved backup is missing from this browser');const bytes=new Uint8Array(raw);let encoded='';for(let i=0;i<bytes.length;i+=32768)encoded+=String.fromCharCode(...bytes.subarray(i,i+32768));const text=JSON.stringify({selected:{id:ref.id,data:btoa(encoded)}});if(text.length>256000000)throw new Error('Backup is too large for recovery transfer');memory.transfer={key,id:crypto.randomUUID(),text,index:0,total:Math.ceil(text.length/1000000),sent:-1}}
const t=memory.transfer;if(a.upload_ack?.id===t.id)t.index=a.upload_ack.index+1;if(t.index>=t.total)return;if(t.sent!==t.index||t.generation!==a.generation){t.sent=t.index;t.generation=a.generation;emit({upload_part:{id:t.id,index:t.index,total:t.total,data:t.text.slice(t.index*1000000,(t.index+1)*1000000)}})}status('Restoring saved workspace… '+Math.round(t.index/t.total*100)+'%')}
async function syncOpen(a){const db=await dbPromise;const rows=await request(db.transaction('metadata').objectStore('metadata').getAll());const open=new Set(a.records.map(r=>r.id));const tx=db.transaction('metadata','readwrite'),done=complete(tx);for(const row of rows)if(row.open!==open.has(row.id))tx.objectStore('metadata').put({...row,open:open.has(row.id)});await done;if(a.active)localStorage.setItem('simmah-workspace-active',a.active);else localStorage.removeItem('simmah-workspace-active')}
async function render(a){args=a;try{if(!a.ready){status('Checking saved workspace…');await boot(a);return}if(a.restore){await restore(a.restore,a);return}if(a.restored&&memory.transfer?.id===a.restored)delete memory.transfer;await syncOpen(a);const missing=a.records.some(r=>!(a.backups||[]).some(b=>b.id===r.id));const pending=(a.backups||[]).filter(r=>memory.saved[r.id]?.digest!==r.digest||memory.saved[r.id]?.revision!==r.revision);if(a.error)status(a.error,'error');if(Date.now()<memory.retryAfter)return;if(a.busy||pending.length||missing)status('Saving changes…');else if(!a.error)status(a.records.length?'Saved in this browser · Ready for reboot':'Workspace ready',a.records.length?'saved':'');await Promise.all(pending.map(r=>save(r,a)))}catch(error){memory.retryAfter=Date.now()+10000;if(!a.ready)memory.boots.delete(a.generation);status('Changes are not saved: '+error.message,'error');emit({error:error.message})}}
window.addEventListener('message',event=>{if(event.data?.type==='streamlit:render')render(event.data.args)});send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:28});
</script></body></html>
