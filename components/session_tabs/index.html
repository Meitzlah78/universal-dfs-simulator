<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;font:13px system-ui;color:#c6d8e8}#tabs{display:flex;gap:7px;overflow:auto;padding:5px 0}button{background:#102536;color:#c6d8e8;border:1px solid #34516b;border-radius:6px;padding:8px 11px;white-space:nowrap;cursor:pointer}button.active{background:#225a80;color:white}small{color:#91a9be}</style></head><body><div id="tabs"></div><small id="note"></small><script>
const send=(type,extra={})=>window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
window.addEventListener('message',event=>{if(event.data?.type!=='streamlit:render')return;const a=event.data.args,bar=document.getElementById('tabs');bar.replaceChildren();for(const r of a.records||[]){const b=document.createElement('button');b.textContent=r.title||r.name;b.title=r.name;b.className=r.id===a.active?'active':'';b.onclick=()=>{if(r.id!==a.active)send('streamlit:setComponentValue',{value:{event:crypto.randomUUID(),selected_id:r.id},dataType:'json'})};bar.append(b)}document.getElementById('note').textContent='Fresh workspace: tabs and builds stay in this session. Automatic browser restoration is paused.';send('streamlit:setFrameHeight',{height:75})});
send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:75});
</script></body></html>
