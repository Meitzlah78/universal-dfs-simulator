name: Fix DFF FanDuel physical columns
on:
  workflow_dispatch:
  push:
    branches: [feature/salary-csv-upload]
    paths:
      - '.github/workflows/fix-dff-fd-physical-columns.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/fix_dff_fd_physical_columns.py
      - run: python -m py_compile dfs_app.py
      - run: grep -q 'table.iloc\[:, 6\]' dfs_app.py
      - run: grep -q 'table.iloc\[:, 7\]' dfs_app.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add dfs_app.py
          git commit -m 'Fix DFF FanDuel physical column parsing [skip ci]' || exit 0
          git push origin HEAD:feature/salary-csv-upload
