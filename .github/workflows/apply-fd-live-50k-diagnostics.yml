name: Apply FD live 50K diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-fd-live-50k-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
          fetch-depth: 0
      - name: Apply tested FanDuel changes
        run: |
          python .github/scripts/add_fd_final_roi_50k_clean.py
          python .github/scripts/add_fd_final_duplication_diagnostic.py
          python .github/scripts/export_fd_duplication_diagnostics.py
      - name: Syntax check
        run: python -m py_compile dfs_app.py
      - name: Verify wiring
        run: |
          grep -q '_fd_final_field' dfs_app.py
          grep -q 'Exact Matches in Final Field' dfs_app.py
          grep -q 'Estimated Field Copies' dfs_app.py
      - name: Commit live app change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dfs_app.py
          git diff --cached --quiet || git commit -m 'Use 50K FanDuel final ROI with duplication diagnostics [skip ci]'
          git push origin HEAD:feature/salary-csv-upload
