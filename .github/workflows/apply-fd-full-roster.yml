name: Apply FanDuel Full Roster setup

on:
  push:
    branches:
      - feature/salary-csv-upload
    paths:
      - '.github/scripts/make_fd_full_roster_setup.py'
      - '.github/scripts/fix_fd_player_pool_refresh.py'
      - '.github/workflows/apply-fd-full-roster.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply FanDuel-only patch
        run: python .github/scripts/make_fd_full_roster_setup.py
      - name: Refresh FanDuel Player Pool after SIM
        run: python .github/scripts/fix_fd_player_pool_refresh.py
      - name: Syntax check
        run: python -m py_compile dfs_app.py
      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dfs_app.py
          if git diff --cached --quiet; then
            echo "No app changes needed"
          else
            git commit -m "Apply FanDuel Full Roster defaults [skip ci]"
            git push origin HEAD:feature/salary-csv-upload
          fi
