name: Apply DK Vector Candidate Semantics Fix

on:
  push:
    branches: [refactor/dk-showdown-engine]
    paths: ['.github/workflows/apply-dk-vector-candidate-semantics-fix.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dk-showdown-engine
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas pytest
      - name: Apply semantics fix
        run: python .github/scripts/fix_dk_vector_candidate_semantics.py
      - name: Verify transformed app
        run: |
          python -m py_compile dfs_app.py dk_showdown_engine.py
          grep -q 'MIN_LINEUP_SALARY' dfs_app.py
          grep -q 'batch_valid\[sampled_row\]' dfs_app.py
      - name: Run DK parity suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python -m pytest -q
          tests/test_dk_showdown_engine.py
          tests/test_dk_weighted_field.py
          tests/test_dk_weighted_portfolio_parity.py
          tests/test_dk_compressed_end_to_end.py
          tests/test_dk_payout_hotpath.py
      - name: Commit corrected app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dfs_app.py
          git commit -m 'Preserve DK candidate rejection semantics in vector path'
          git push origin HEAD:refactor/dk-showdown-engine
