name: Install DK duplicate tail calibration

on:
  push:
    branches: [refactor/dk-showdown-engine]
    paths:
      - '.github/scripts/install_dk_duplicate_tail.py'
      - '.github/workflows/install-dk-duplicate-tail.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dk-showdown-engine
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Apply duplicate-tail production patch
        run: python .github/scripts/install_dk_duplicate_tail.py
      - name: Compile engine and app
        run: python -m py_compile dk_showdown_engine.py dfs_app.py
      - name: Verify calibrated duplicate entry mass
        run: |
          python - <<'PY'
          import numpy as np
          from dk_showdown_engine import duplicate_expansion_counts
          values = np.random.default_rng(20261016).normal(-14.0, 2.0, size=10_000)
          counts = duplicate_expansion_counts(values, 47_271, seed=7)
          positive = counts[counts > 0]
          singleton = positive[positive == 1].sum() / counts.sum()
          ten_plus = positive[positive >= 10].sum() / counts.sum()
          twenty_plus = positive[positive >= 20].sum() / counts.sum()
          unique_rate = len(positive) / counts.sum()
          print(f'unique={unique_rate:.4f} singleton={singleton:.4f} 10+={ten_plus:.4f} 20+={twenty_plus:.4f} max={positive.max()}')
          assert 0.09 <= singleton <= 0.13
          assert 0.48 <= ten_plus <= 0.66
          assert 0.32 <= twenty_plus <= 0.50
          assert 0.18 <= unique_rate <= 0.25
          assert positive.max() > 300
          PY
          python -m unittest \
            tests.test_dk_showdown_field_realism \
            tests.test_dk_showdown_actual_field_targets \
            tests.test_dk_showdown_latest_actual_field \
            tests.test_dk_showdown_duplicate_calibration
      - name: Verify production wiring
        run: |
          grep -q 'duplicate_expansion_counts' dk_showdown_engine.py
          grep -q 'dk_duplicate_expansion_counts' dfs_app.py
          grep -q 'np.repeat' dfs_app.py
      - name: Commit production patch
        run: |
          if git diff --quiet -- dk_showdown_engine.py dfs_app.py; then
            echo 'No production changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dk_showdown_engine.py dfs_app.py
          git commit -m 'Preserve DK Showdown singleton duplicate tail'
          git push origin HEAD:refactor/dk-showdown-engine
