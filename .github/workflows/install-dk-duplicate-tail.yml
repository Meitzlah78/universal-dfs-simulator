name: Install DK duplicate tail calibration

on:
  push:
    branches: [refactor/dk-showdown-engine]
    paths:
      - '.github/scripts/install_dk_duplicate_tail.py'
      - '.github/workflows/install-dk-duplicate-tail.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dk-showdown-engine
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Apply duplicate-tail production patch
        run: python .github/scripts/install_dk_duplicate_tail.py
      - name: Compile engine and app
        run: python -m py_compile dk_showdown_engine.py dfs_app.py
      - name: Verify calibrated duplicate entry mass
        run: python -m unittest tests.test_dk_showdown_expansion_shape
      - name: Verify production wiring
        run: |
          grep -q 'duplicate_expansion_counts' dk_showdown_engine.py
          grep -q 'dk_duplicate_expansion_counts' dfs_app.py
          grep -q 'np.repeat' dfs_app.py
      - name: Commit production patch
        run: |
          if git diff --quiet -- dk_showdown_engine.py dfs_app.py; then
            echo 'No production changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dk_showdown_engine.py dfs_app.py
          git commit -m 'Preserve DK Showdown singleton duplicate tail'
          git push origin HEAD:refactor/dk-showdown-engine
