name: NBA build and export regression

on:
  push:
    paths:
      - 'simmah_nba*.py'
      - 'simmah_portfolio*.py'
      - 'simmah_slate_workspaces.py'
      - 'simmah_export_history.py'
      - 'simmah_archive*.py'
      - 'data/nba_*/**'
      - 'data/nba_payscales.json'
      - 'tests/test_nba*.py'
      - 'tests/nba_ui_fixture.py'
      - 'scripts/check_nba_build.py'
      - 'requirements.txt'
      - '.github/workflows/nba-build-check.yml'
  pull_request:
    paths:
      - 'simmah_nba*.py'
      - 'simmah_portfolio*.py'
      - 'simmah_slate_workspaces.py'
      - 'simmah_export_history.py'
      - 'simmah_archive*.py'
      - 'data/nba_*/**'
      - 'data/nba_payscales.json'
      - 'tests/test_nba*.py'
      - 'tests/nba_ui_fixture.py'
      - 'scripts/check_nba_build.py'
      - 'requirements.txt'
      - '.github/workflows/nba-build-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nba-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile NBA modules
        run: python -m compileall -q simmah_nba*.py scripts/check_nba_build.py
      - name: Check NBA input, simulation, field, workspace and export regressions
        run: python scripts/check_nba_build.py
      - name: Replay full-size FanDuel build through entries export
        run: python scripts/check_nba_build.py --full-scale
