name: Test DK Matrix Wiring

on:
  push:
    branches:
      - refactor/dk-wire-matrix-scoring-safe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix-wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install numpy pandas pytest
      - name: Apply matrix scoring patch
        run: python .github/scripts/wire_dk_matrix_scoring.py
      - name: Compile transformed app and engine
        run: python -m py_compile dfs_app.py dk_showdown_engine.py
      - name: Run DK engine parity tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_dk_showdown_engine.py
      - name: Verify transformed scoring hooks
        run: |
          grep -q 'score_lineup_matrix as dk_score_lineup_matrix' dfs_app.py
          test "$(grep -c 'dk_score_lineup_matrix(' dfs_app.py)" -eq 4
