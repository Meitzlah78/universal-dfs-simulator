name: Apply FanDuel portfolio diversification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-fd-portfolio-diversification.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Keep FanDuel Full Roster portfolio diversification
        run: python .github/scripts/diversify_fd_full_roster_portfolio.py
      - name: Increase FanDuel final ROI holdout sample
        run: python .github/scripts/increase_fd_roi_holdout_samples.py
      - name: Syntax check
        run: python -m py_compile dfs_app.py
      - name: Commit patch
        run: |
          if git diff --quiet -- dfs_app.py; then
            echo 'No app changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dfs_app.py
          git commit -m 'Stabilize FanDuel Full Roster ROI sampling [skip ci]'
          git push origin HEAD:feature/salary-csv-upload
