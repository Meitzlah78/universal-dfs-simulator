name: Probe DFF FanDuel slate IDs
on:
  workflow_dispatch:
  push:
    branches: [feature/salary-csv-upload]
    paths: ['.github/workflows/probe-dff-fd-slate-ids.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/salary-csv-upload}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python .github/scripts/probe_dff_fd_slate_ids.py
