name: Add FantasyPros integration
on:
  push:
    branches: [feature/salary-csv-upload]
    paths: ['.github/workflows/add-fantasypros-api-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/add_fantasypros_api.py
      - run: python -m py_compile dfs_app.py
      - run: grep -q 'api.fantasypros.com/public/v2/json/nfl' dfs_app.py
      - name: Commit app
        run: |
          git config user.name simmah-bot
          git config user.email simmah-bot@users.noreply.github.com
          git add dfs_app.py
          git commit -m 'Add FantasyPros projection API [skip ci]' || exit 0
          git push origin HEAD:feature/salary-csv-upload
