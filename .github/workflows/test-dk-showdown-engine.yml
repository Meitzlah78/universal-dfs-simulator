name: Test DK Showdown Engine

on:
  push:
    branches:
      - refactor/dk-showdown-engine
  workflow_dispatch:

jobs:
  parity-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install numpy pandas pytest
      - name: Compile engine
        run: python -m py_compile dk_showdown_engine.py
      - name: Run DK Showdown parity tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_dk_showdown_engine.py
