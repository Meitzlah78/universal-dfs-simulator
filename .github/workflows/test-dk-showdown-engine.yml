name: Test DK Candidate Batch

on:
  push:
    branches:
      - refactor/dk-candidate-batch-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-batch-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply candidate batching patch
        run: python .github/scripts/wire_dk_candidate_batch_sampler.py
      - name: Install test dependencies
        run: pip install numpy pandas pytest
      - name: Compile transformed app and engine
        run: python -m py_compile dfs_app.py dk_showdown_engine.py
      - name: Run DK engine parity tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_dk_showdown_engine.py tests/test_dk_candidate_batch_patch.py
