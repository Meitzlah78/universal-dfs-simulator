name: Test DK Showdown Engine

on:
  push:
    branches:
      - refactor/dk-showdown-engine
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parity-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dk-showdown-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wire fast opponent builder
        if: ${{ github.event.head_commit.message == 'Wire fast DK opponent builder through tested workflow' }}
        run: python .github/scripts/wire_dk_batch_sampler.py
      - name: Install test dependencies
        run: pip install numpy pandas pytest
      - name: Compile
        run: python -m py_compile dfs_app.py dk_showdown_engine.py
      - name: Run DK Showdown parity tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_dk_showdown_engine.py
      - name: Commit wired fast builder
        if: ${{ github.event.head_commit.message == 'Wire fast DK opponent builder through tested workflow' }}
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add dfs_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Wire vectorized DK opponent builder"
          git push origin HEAD:refactor/dk-showdown-engine
