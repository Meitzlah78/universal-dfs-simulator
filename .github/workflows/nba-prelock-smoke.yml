name: NBA pre-lock smoke test
on:
  workflow_dispatch:
  push:
    branches: [research/nba-prelock-smoke]
    paths: [.github/workflows/nba-prelock-smoke.yml]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas pyarrow boto3
      - name: Verify NBA schedule, RotoWire and S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION || secrets.AWS_REGION || vars.AWS_REGION }}
          INPUT_ARCHIVE_BUCKET: ${{ secrets.SIMMAH_INPUT_ARCHIVE_BUCKET || vars.SIMMAH_INPUT_ARCHIVE_BUCKET || secrets.INPUT_ARCHIVE_BUCKET || vars.INPUT_ARCHIVE_BUCKET }}
          INPUT_ARCHIVE_PREFIX: ${{ secrets.SIMMAH_INPUT_ARCHIVE_PREFIX || vars.SIMMAH_INPUT_ARCHIVE_PREFIX || secrets.INPUT_ARCHIVE_PREFIX || vars.INPUT_ARCHIVE_PREFIX }}
        run: |
          python - <<'PY'
          import io
          import json
          import os
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          from zoneinfo import ZoneInfo

          import boto3
          import pandas as pd
          from simmah_nba_projections import download_rotowire
          from simmah_nba_lineups import download_lineup_status

          def utc_now():
              return datetime.now(timezone.utc).isoformat()

          def get(label, url):
              request = Request(url, headers={'User-Agent': 'Mozilla/5.0', 'Accept': 'application/json'})
              try:
                  with urlopen(request, timeout=12) as response:
                      print(label, response.status, response.headers.get_content_type(), flush=True)
                      return json.load(response)
              except HTTPError as error:
                  print(label, error.code, error.headers.get_content_type(), flush=True)
                  raise

          def tip(value):
              parsed = datetime.fromisoformat(value.replace('Z', '+00:00'))
              if parsed.tzinfo is None:
                  raise ValueError('Missing tip-off timezone')
              return parsed.astimezone(timezone.utc)

          from simmah_nba_projections import player_key, team_key

          RW = 'https://www.rotowire.com/daily/nba/api/'
          ET = ZoneInfo('America/New_York')

          def nba_schedule(day):
              data = get('ESPN NBA schedule', 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/'
                         'scoreboard?dates=' + day.replace('-', ''))
              games = {}
              for event in data['events']:
                  game = event['competitions'][0]
                  start = tip(game['date'])
                  if start.astimezone(ET).date().isoformat() != day:
                      continue
                  teams = tuple(sorted(team_key(t['team']['abbreviation']) for t in game['competitors']))
                  if teams in games:
                      raise ValueError('Ambiguous team matchup in schedule')
                  games[teams] = (start, str(event['id']))
              if not games:
                  raise ValueError('No verified schedule games for ' + day)
              return games

          def provider_pool(day, platform, schedule):
              site, contest = ('1', 'Classic') if platform == 'DraftKings' else ('2', 'Full Roster')
              listing = get(platform + ' RotoWire slate list', RW + 'slate-list.php?siteID=' + site)
              choices = []
              for slate in listing['slates']:
                  if slate.get('startDateOnly') != day or slate.get('contestType') != contest:
                      continue
                  games = [listing['games'][str(g)] for g in slate['games']]
                  pairs = {tuple(sorted((team_key(g['homeTeamCode']), team_key(g['visitTeamCode'])))) for g in games}
                  if pairs and pairs <= schedule.keys():
                      choices.append((len(pairs), str(slate.get('defaultSlate')).lower() in ('true','1'),
                                      str(slate['slateID']), pairs))
              if not choices:
                  raise ValueError('No date-matched RotoWire slate aligned to the NBA schedule')
              _, _, sid, selected_pairs = max(choices, key=lambda c: c[:3])
              if not sid.isdigit():
                  raise ValueError('Invalid RotoWire slate ID')
              rows, keys = [], set()
              for p in get(platform + ' RotoWire players', RW + 'players.php?slateID=' + sid):
                  team = team_key(p['team']['abbr'])
                  opp = team_key(p['opponent']['team'])
                  pair = tuple(sorted((team, opp)))
                  name = (p['firstName'] + ' ' + p['lastName']).strip()
                  key = player_key(name, team)
                  if pair not in selected_pairs or not key[0] or key in keys:
                      raise ValueError('Invalid or duplicate RotoWire player or matchup')
                  keys.add(key)
                  start, event = schedule[pair]
                  rows.append({'Name': name, 'Team': team, 'Opponent': opp,
                               'RotoWire Player Slate ID': str(p['slateID']), 'nba_event_id': event,
                               'scheduled_tipoff_utc': start.isoformat(), 'bootstrap_injury_tag': p.get('injuryStatus')})
              if not rows or {tuple(sorted((r['Team'], r['Opponent']))) for r in rows} != selected_pairs:
                  raise ValueError('Incomplete player pool coverage for the selected slate')
              return sid, rows

          def status(raw):
              if raw is None or not str(raw).strip():
                  return None
              code = str(raw).strip().upper()
              return {'O':'OUT', 'IR':'OUT', 'SUSPENDED':'OUT', 'D':'DOUBTFUL', 'Q':'QUESTIONABLE',
                      'P':'PROBABLE', 'A':'ACTIVE'}.get(code, code if code in
                      {'OUT','DOUBTFUL','QUESTIONABLE','PROBABLE','GTD','ACTIVE'} else None)

          day = os.getenv('SMOKE_DAY') or datetime.now(ET).date().isoformat()
          schedule = nba_schedule(day)
          summary, frames = {'date_et': day, 'scheduled_games': len(schedule),
                             'dk_enrichment_status': 'not_configured', 'fd_enrichment_status': 'not_configured'}, []
          for platform in ('DraftKings', 'FanDuel'):
              report = summary[platform] = {}
              try:
                  bootstrap_sid, rows = provider_pool(day, platform, schedule)
                  pool = pd.DataFrame(rows)
                  pairs = sorted({(r.Team, r.Opponent) for r in pool.itertuples()})
                  report.update(bootstrap_slate_id=bootstrap_sid, player_rows=len(pool), games=len(pairs)//2)
                  evidence = {}
                  values, details, sid = {}, {}, bootstrap_sid
                  try:
                      values, details, sid = download_rotowire(day, pool, platform, evidence=evidence)
                      report['rotowire_completed_at_utc'] = utc_now()
                  except Exception as error:
                      report['projection_error'] = f'{type(error).__name__}: {error}'
                  lineup = {}
                  try:
                      lineup = download_lineup_status(sid, day, pairs)['players']
                      report['lineups_completed_at_utc'] = utc_now()
                  except Exception as error:
                      report['lineup_error'] = f'{type(error).__name__}: {error}'
                  raw_payload = evidence.get('requests', {}).get('players.php?slateID=' + sid, {}).get('payload', [])
                  raw_tags = {player_key(p['firstName'] + ' ' + p['lastName'], p['team']['abbr']): p.get('injuryStatus')
                              for p in raw_payload}
                  report.update(rotowire_slate_id=sid, fallback_mode=evidence.get('scope'),
                                projections=len(values), minutes=sum(x.get('Projected Minutes') is not None
                                for x in details.values()), ownership=sum(x.get('RotoWire Projected Own %') is not None
                                for x in details.values()), lineup_rows=len(lineup))
                  for r in rows:
                      key = player_key(r['Name'], r['Team'])
                      raw = raw_tags.get(key)
                      detail = details.get(key, {})
                      proj_at = report.get('rotowire_completed_at_utc')
                      lineup_at = report.get('lineups_completed_at_utc')
                      frames.append({**r, 'platform': platform, 'rotowire_slate_id': sid,
                                     'projection': values.get(key), 'minutes': detail.get('Projected Minutes'),
                                     'ownership': detail.get('RotoWire Projected Own %'), 'raw_injury_tag': raw,
                                     'normalized_status': status(raw), 'expected_starter': lineup.get(key, {}).get('Expected Starter'),
                                     'starter_confirmed': lineup.get(key, {}).get('Starter Confirmed'),
                                     'rotowire_completed_at_utc': proj_at, 'lineups_completed_at_utc': lineup_at,
                                     'rotowire_prelock': bool(proj_at and tip(proj_at) < tip(r['scheduled_tipoff_utc'])),
                                     'lineups_prelock': bool(lineup_at and tip(lineup_at) < tip(r['scheduled_tipoff_utc']))})
              except Exception as error:
                  report['error'] = f'{type(error).__name__}: {error}'
              print(platform, json.dumps(report), flush=True)
          print('Smoke manifest', json.dumps(summary), flush=True)
          required = ('AWS_ACCESS_KEY_ID', 'AWS_SECRET_ACCESS_KEY', 'AWS_REGION', 'INPUT_ARCHIVE_BUCKET')
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              print('S3 PutObject unavailable. Missing configuration names:', ', '.join(missing), flush=True)
              raise SystemExit(1)
          root = os.environ.get('INPUT_ARCHIVE_PREFIX', '').strip('/')
          key = '/'.join(value for value in (root, 'prelock_snapshots', '_smoke_test',
                          day, os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']) if value)
          client = boto3.client('s3', region_name=os.environ['AWS_REGION'])
          bucket = os.environ['INPUT_ARCHIVE_BUCKET']
          if frames:
              buffer = io.BytesIO()
              pd.DataFrame(frames).to_parquet(buffer, index=False)
              response = client.put_object(Bucket=bucket, Key=key+'/snapshot.parquet', Body=buffer.getvalue())
              print('S3 snapshot PutObject', response['ResponseMetadata']['HTTPStatusCode'])
          summary['snapshot_written'] = bool(frames)
          response = client.put_object(Bucket=bucket, Key=key+'/manifest.json',
                                       Body=json.dumps(summary).encode(), ContentType='application/json')
          print('S3 manifest PutObject', response['ResponseMetadata']['HTTPStatusCode'])
          raise SystemExit(0 if frames and all(summary[name].get('minutes') and summary[name].get('lineup_rows')
                                                    for name in ('DraftKings', 'FanDuel')) else 1)
          PY
