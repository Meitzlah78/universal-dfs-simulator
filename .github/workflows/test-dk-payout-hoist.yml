name: Test DK Payout Hoist

on:
  push:
    branches:
      - refactor/dk-showdown-engine
    paths:
      - '.github/scripts/hoist_dk_payout_setup.py'
      - '.github/workflows/test-dk-payout-hoist.yml'
      - 'tests/test_dk_payout_hotpath.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas pytest streamlit
      - name: Apply payout setup hoist to checkout
        run: python .github/scripts/hoist_dk_payout_setup.py
      - name: Compile transformed app
        run: python -m py_compile dfs_app.py dk_showdown_engine.py
      - name: Run DK parity suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python -m pytest -q
          tests/test_dk_showdown_engine.py
          tests/test_dk_weighted_field.py
          tests/test_dk_weighted_portfolio_parity.py
          tests/test_dk_compressed_end_to_end.py
          tests/test_dk_payout_hotpath.py
