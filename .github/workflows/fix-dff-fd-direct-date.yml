name: Fix DFF FanDuel direct date fallback

on:
  push:
    branches: [feature/salary-csv-upload]
    paths:
      - '.github/scripts/fix_dff_fd_direct_date.py'
      - '.github/workflows/fix-dff-fd-direct-date.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/fix_dff_fd_direct_date.py
      - run: python -m py_compile dfs_app.py
      - run: grep -q 'Final FanDuel single-game fallback' dfs_app.py
      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dfs_app.py
          if git diff --cached --quiet; then
            echo "No app changes to commit"
          else
            git commit -m "Add direct dated DFF FanDuel fallback [skip ci]"
            git push origin HEAD:feature/salary-csv-upload
          fi
