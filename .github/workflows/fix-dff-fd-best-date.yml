name: Fix DFF FanDuel best date
on:
  workflow_dispatch:
  push:
    branches: [feature/salary-csv-upload]
    paths: ['.github/workflows/fix-dff-fd-best-date.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/salary-csv-upload}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python .github/scripts/fix_dff_fd_best_date.py
      - run: python -m py_compile dfs_app.py
      - run: grep -q 'best_overlap' dfs_app.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add dfs_app.py
          git commit -m 'Choose DFF FanDuel date by maximum player overlap [skip ci]' || exit 0
          git push origin HEAD:feature/salary-csv-upload
