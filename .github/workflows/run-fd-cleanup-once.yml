name: Run FanDuel cleanup once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/run-fd-cleanup-once.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/fd-stale-code
      - name: Remove behavior-neutral stale code
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dfs_app.py')
          s = p.read_text()
          old = s
          s = s.replace('        seen_opponents = set()\n', '')
          s = s.replace('                    key = tuple(chosen[slot] for slot in fd_slots)\n                    # Keep duplicates: real FanDuel fields contain repeated lineups,\n                    # and those duplicates must share prizes when they tie.\n                    seen_opponents.add(key)\n', '                    # Keep duplicates: real FanDuel fields contain repeated lineups,\n                    # and those duplicates must share prizes when they tie.\n')
          if s == old:
              raise SystemExit('Expected dead opponent-tracking code not found')
          p.write_text(s)
          PY
      - name: Syntax check
        run: python -m py_compile dfs_app.py
      - name: Commit cleanup branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dfs_app.py
          git commit -m 'Remove dead FanDuel opponent tracking [skip ci]'
          git push origin HEAD:cleanup/fd-stale-code
