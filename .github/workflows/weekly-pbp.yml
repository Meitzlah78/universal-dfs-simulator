name: NFL completed games and automatic learning

on:
  schedule:
    # Daily after the prior evening's games; NFL season is inferred from date.
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-game-learning-${{ github.ref }}
  cancel-in-progress: false

jobs:
  learn-completed-games:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install learning dependencies
        run: python -m pip install numpy pandas requests "scipy>=1.11"
      - name: Refresh complete NFL games or use saved archives
        run: python scripts/archive_nfl_learning_games.py
      - name: Train select validate and retain accepted components
        run: python -m simmah_nfl_event_learning
      - name: Record broader full-game candidate diagnostics
        run: python scripts/learn_nfl_performance.py
      - name: Commit game archives and learning records
        run: |
          if [[ -n "$(git status --porcelain data/pbp data/nfl_models)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/pbp/ data/nfl_models/
            git commit -m "Learn NFL components from completed games"
            for attempt in 1 2 3; do
              git pull --rebase
              if git push; then exit 0; fi
            done
            exit 1
          fi
