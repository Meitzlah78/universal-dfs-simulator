name: Cleanup FanDuel stale code

on:
  push:
    branches:
      - cleanup/fd-stale-code
    paths:
      - '.github/scripts/cleanup_fd_salary_bounds.py'
      - '.github/workflows/cleanup-fd-stale-code.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/fd-stale-code
      - name: Apply salary-bound cleanup
        run: python .github/scripts/cleanup_fd_salary_bounds.py
      - name: Syntax check
        run: python -m py_compile dfs_app.py
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dfs_app.py
          if git diff --cached --quiet; then
            echo 'No dfs_app.py cleanup changes to commit.'
          else
            git commit -m 'Consolidate FanDuel opponent salary bounds [skip ci]'
            git push origin HEAD:cleanup/fd-stale-code
          fi
