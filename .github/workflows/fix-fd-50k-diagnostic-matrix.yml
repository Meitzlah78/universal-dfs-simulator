name: Fix FD 50K diagnostic matrix
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_fd_50k_diagnostic_matrix.py'
      - '.github/workflows/fix-fd-50k-diagnostic-matrix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
          fetch-depth: 0
      - name: Apply matrix hotfix
        run: python .github/scripts/fix_fd_50k_diagnostic_matrix.py
      - name: Syntax check
        run: python -m py_compile dfs_app.py
      - name: Verify matrix separation
        run: |
          grep -q '_fd_diag_field_matrix = _fd_matrix_indices(opponent_df)' dfs_app.py
          grep -q '_fd_diag_field_matrix\[:, _slot_pos\]' dfs_app.py
          grep -q '_fd_diag_scale' dfs_app.py
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dfs_app.py
          git diff --cached --quiet || git commit -m 'Fix FanDuel 50K diagnostic field matrix [skip ci]'
          git push origin HEAD:feature/salary-csv-upload
