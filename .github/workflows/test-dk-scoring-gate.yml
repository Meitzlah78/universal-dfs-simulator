name: Test DK Scoring Gate

on:
  push:
    branches:
      - refactor/dk-unique-field-scoring
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas pytest
      - name: Apply scoring gate patch
        run: python .github/scripts/fix_dk_scoring_gate.py
      - name: Compile transformed app and engine
        run: python -m py_compile dfs_app.py dk_showdown_engine.py
      - name: Run DK engine parity tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_dk_showdown_engine.py
      - name: Verify explicit DK gate and generic multiplier preservation
        run: |
          grep -q 'is_dk_showdown = platform == "DraftKings" and lineup_mode != "Classic"' dfs_app.py
          test "$(grep -c 'if is_dk_showdown:' dfs_app.py)" -ge 2
          test "$(grep -c 'if scoring_multiplier != 1.0:' dfs_app.py)" -ge 3
          ! grep -q 'if scoring_multiplier == 1.5 and candidate_idx.shape\[1\] == 6:' dfs_app.py
