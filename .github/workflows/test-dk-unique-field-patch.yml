name: Test DK Unique Field Patch

on:
  push:
    branches:
      - refactor/dk-compress-field-hotpath
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unique-field-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas pytest
      - name: Validate compression and weighted rank parity
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_dk_unique_field_patch.py tests/test_dk_weighted_portfolio_parity.py
      - name: Apply patches and compile transformed app
        run: |
          python .github/scripts/wire_dk_unique_field_indices.py
          python .github/scripts/wire_dk_unique_field_scoring.py
          python -m py_compile dfs_app.py
          grep -q 'contest_unique_idx if is_dk_showdown else contest_idx' dfs_app.py
