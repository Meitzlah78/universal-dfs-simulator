name: Test DK Showdown field calibration

on:
  push:
    branches: [refactor/dk-showdown-engine]
    paths:
      - 'dfs_app.py'
      - 'dk_showdown_engine.py'
      - 'dk_showdown_history.py'
      - 'tests/test_dk_showdown_field_realism.py'
      - 'tests/test_dk_showdown_actual_field_targets.py'
      - 'tests/test_dk_showdown_latest_actual_field.py'
      - 'tests/test_dk_showdown_real_contest_score_targets.py'
      - 'tests/test_dk_showdown_captain_calibration.py'
      - 'tests/test_dk_showdown_captain_source_behavior.py'
      - 'tests/test_dk_showdown_ownership_priority.py'
      - 'tests/test_dk_showdown_duplicate_calibration.py'
      - 'tests/test_dk_showdown_expansion_shape.py'
      - 'tests/test_dk_showdown_opponent_quality.py'
      - 'tests/test_dk_showdown_field_strength.py'
      - 'tests/test_dk_showdown_finish_rate_calibration.py'
      - 'tests/test_dk_showdown_contest_end_to_end.py'
      - 'tests/test_dk_showdown_production_wiring.py'
      - 'tests/test_dk_showdown_competitive_lineup_score.py'
      - 'tests/test_dk_showdown_ev_portfolio_selection.py'
      - 'tests/test_dk_showdown_ev_selection_behavior.py'
      - 'tests/test_dk_showdown_temporal_learning.py'
      - 'tests/test_dk_showdown_history_features.py'
      - 'tests/test_dk_showdown_history_construction_features.py'
      - 'tests/test_dk_showdown_ev_calibration.py'
      - '.github/workflows/test-dk-showdown-field-calibration.yml'

jobs:
  field-calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dk-showdown-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Compile DK engine, history and app
        run: python -m py_compile dfs_app.py dk_showdown_engine.py dk_showdown_history.py
      - name: Verify DK field calibration, historical learning, EV selection and contest behavior
        run: >-
          python -m unittest
          tests.test_dk_showdown_field_realism
          tests.test_dk_showdown_actual_field_targets
          tests.test_dk_showdown_latest_actual_field
          tests.test_dk_showdown_real_contest_score_targets
          tests.test_dk_showdown_captain_calibration
          tests.test_dk_showdown_captain_source_behavior
          tests.test_dk_showdown_ownership_priority
          tests.test_dk_showdown_duplicate_calibration
          tests.test_dk_showdown_expansion_shape
          tests.test_dk_showdown_opponent_quality
          tests.test_dk_showdown_field_strength
          tests.test_dk_showdown_finish_rate_calibration
          tests.test_dk_showdown_contest_end_to_end
          tests.test_dk_showdown_production_wiring
          tests.test_dk_showdown_competitive_lineup_score
          tests.test_dk_showdown_ev_portfolio_selection
          tests.test_dk_showdown_ev_selection_behavior
          tests.test_dk_showdown_temporal_learning
          tests.test_dk_showdown_history_features
          tests.test_dk_showdown_history_construction_features
          tests.test_dk_showdown_ev_calibration
