name: Apply DK Showdown field fallback

on:
  push:
    branches: [refactor/dk-showdown-engine]
    paths:
      - '.github/scripts/isolate_dk_showdown_field_fallback.py'
      - '.github/workflows/apply-dk-showdown-field-fallback.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dk-showdown-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply DK-only field fallback
        run: python .github/scripts/isolate_dk_showdown_field_fallback.py
      - name: Compile app
        run: python -m py_compile dfs_app.py dk_showdown_engine.py
      - name: Commit installed change
        run: |
          if git diff --quiet; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dfs_app.py
          git commit -m 'Strengthen DK Showdown opponent fallback field'
          git push origin HEAD:refactor/dk-showdown-engine
