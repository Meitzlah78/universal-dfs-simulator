name: Apply persistent FanDuel sanity and opponent info

on:
  push:
    branches: [feature/salary-csv-upload]
    paths:
      - '.github/scripts/persist_fd_sanity_and_opponents.py'
      - '.github/workflows/persist-fd-sanity-opponents.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch app
        run: python .github/scripts/persist_fd_sanity_and_opponents.py
      - name: Syntax check
        run: python -m py_compile dfs_app.py
      - name: Commit app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dfs_app.py
          if git diff --cached --quiet; then
            echo "No app changes needed"
          else
            git commit -m "Persist FanDuel sanity and opponent lineup info [skip ci]"
            git push origin HEAD:feature/salary-csv-upload
          fi
