name: Remove duplicate FanDuel salary bounds

on:
  push:
    branches:
      - cleanup/fd-stale-code
    paths:
      - '.github/scripts/remove_fd_duplicate_salary_bounds.py'
      - '.github/workflows/remove-fd-duplicate-salary-bounds.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/fd-stale-code
      - name: Remove duplicate salary assignments
        run: python .github/scripts/remove_fd_duplicate_salary_bounds.py
      - name: Syntax check
        run: python -m py_compile dfs_app.py
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dfs_app.py
          if git diff --cached --quiet; then
            echo 'No cleanup changes.'
          else
            git commit -m 'Remove duplicate FanDuel salary bounds [skip ci]'
            git push origin HEAD:cleanup/fd-stale-code
          fi
