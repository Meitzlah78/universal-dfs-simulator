name: Apply DK Payout Hoist

on:
  push:
    branches:
      - refactor/dk-showdown-engine
    paths:
      - '.github/workflows/apply-dk-payout-hoist.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dk-showdown-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas pytest
      - name: Verify payout parity before transform
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python -m pytest -q
          tests/test_dk_showdown_engine.py
          tests/test_dk_weighted_field.py
          tests/test_dk_weighted_portfolio_parity.py
          tests/test_dk_compressed_end_to_end.py
          tests/test_dk_payout_hotpath.py
      - name: Apply payout setup hoist
        run: python .github/scripts/hoist_dk_payout_setup.py
      - name: Compile transformed app
        run: python -m py_compile dfs_app.py dk_showdown_engine.py
      - name: Commit transformed app
        run: |
          if git diff --quiet -- dfs_app.py; then
            echo 'No app change produced'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dfs_app.py
          git commit -m 'Hoist DK payout setup outside scoring batches'
          git push origin HEAD:refactor/dk-showdown-engine
