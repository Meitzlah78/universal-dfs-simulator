name: Fix DFF FanDuel column selection
on:
  push:
    branches: [feature/salary-csv-upload]
    paths: ['.github/workflows/fix-dff-fd-column-selection.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/fix_dff_fd_column_selection.py
      - run: python -m py_compile dfs_app.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add dfs_app.py
          git commit -m 'Fix DFF FanDuel projection columns' || exit 0
          git push origin HEAD:feature/salary-csv-upload
