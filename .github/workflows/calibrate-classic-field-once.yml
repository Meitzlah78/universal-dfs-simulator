name: Calibrate Classic field once
on:
  push:
    branches: [feature/salary-csv-upload]
    paths: [.github/workflows/calibrate-classic-field-once.yml]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/calibrate_classic_field.py
      - run: python -m py_compile dfs_app.py
      - name: Verify calibration markers
        run: |
          grep -q '_human_weight' dfs_app.py
          grep -q '_stack_count' dfs_app.py
          grep -q '_salary_z' dfs_app.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dfs_app.py
          git commit -m 'Calibrate DraftKings Classic opponent field [skip ci]' || exit 0
          git push origin HEAD:feature/salary-csv-upload
