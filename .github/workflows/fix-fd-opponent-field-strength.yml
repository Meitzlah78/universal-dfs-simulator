name: Fix FanDuel Opponent Field Strength

on:
  push:
    branches:
      - feature/salary-csv-upload
    paths:
      - '.github/scripts/fix_fd_opponent_field_strength.py'
      - '.github/workflows/fix-fd-opponent-field-strength.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply FanDuel field patch
        run: python .github/scripts/fix_fd_opponent_field_strength.py
      - name: Syntax check
        run: python -m py_compile dfs_app.py
      - name: Commit patched app
        run: |
          if git diff --quiet -- dfs_app.py; then
            echo "No app changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dfs_app.py
          git commit -m "Strengthen FanDuel Full Roster opponent field [skip ci]"
          git push origin HEAD:feature/salary-csv-upload
