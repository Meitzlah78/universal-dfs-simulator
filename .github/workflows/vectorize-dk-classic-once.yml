name: Vectorize DraftKings Classic once

on:
  push:
    branches:
      - feature/salary-csv-upload
    paths:
      - '.github/scripts/vectorize_dk_classic.py'
      - '.github/workflows/vectorize-dk-classic-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vectorize DraftKings Classic
        run: python .github/scripts/vectorize_dk_classic.py
      - name: Syntax check
        run: python -m py_compile dfs_app.py
      - name: Verify NumPy Classic engine
        run: |
          grep -q 'NumPy batch builder' dfs_app.py
          grep -q 'NumPy opponent-field generator' dfs_app.py
          if grep -q 'seen_contest = set()' dfs_app.py; then exit 1; fi
      - name: Commit optimized app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dfs_app.py
          if git diff --cached --quiet; then
            echo "No app changes needed"
          else
            git commit -m "Vectorize DraftKings Classic engine [skip ci]"
            git push origin HEAD:feature/salary-csv-upload
          fi
