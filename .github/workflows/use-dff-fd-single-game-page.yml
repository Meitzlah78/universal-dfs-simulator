name: Use DFF FanDuel single-game page
on:
  workflow_dispatch:
  push:
    branches: [feature/salary-csv-upload]
    paths: ['.github/workflows/use-dff-fd-single-game-page.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/salary-csv-upload}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python .github/scripts/use_dff_fd_single_game_page.py
      - run: python -m py_compile dfs_app.py
      - run: grep -Fq 'showdown-single-game-projections/fanduel/{slate_date}' dfs_app.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add dfs_app.py
          git commit -m 'Use DFF FanDuel single-game projection page [skip ci]' || exit 0
          git push origin HEAD:feature/salary-csv-upload
