name: Enable Classic shared PBP once

on:
  push:
    branches:
      - feature/classic-shared-pbp
    paths:
      - '.github/scripts/enable_classic_shared_pbp.py'
      - '.github/workflows/enable-classic-shared-pbp-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/classic-shared-pbp
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply shared PBP patch
        run: python .github/scripts/enable_classic_shared_pbp.py
      - name: Syntax check
        run: python -m py_compile dfs_app.py
      - name: Verify Classic PBP wiring
        run: |
          grep -q 'Shared NFL play-by-play engine for FanDuel and DraftKings Classic' dfs_app.py
          grep -q 'dk_classic_sim_engine' dfs_app.py
          grep -q 'platform="DraftKings"' dfs_app.py
          grep -q 'score_nfl_stat_line(line, platform)' dfs_app.py
      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dfs_app.py
          if git diff --cached --quiet; then
            echo "No app changes to commit"
            exit 0
          fi
          git commit -m "Use shared NFL PBP engine for DraftKings Classic [skip ci]"
          git push origin HEAD:feature/classic-shared-pbp
