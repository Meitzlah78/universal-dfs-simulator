name: Simplify DFF FanDuel Single Game
on:
  push:
    branches: [feature/salary-csv-upload]
    paths:
      - '.github/scripts/simplify_dff_fd_single.py'
      - '.github/workflows/simplify-dff-fd-single.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/simplify_dff_fd_single.py
      - run: python -m py_compile dfs_app.py
      - run: grep -q 'bypass the legacy Showdown routing entirely' dfs_app.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dfs_app.py
          if ! git diff --cached --quiet; then
            git commit -m 'Use direct DFF loader for FanDuel Single Game [skip ci]'
            git push origin HEAD:feature/salary-csv-upload
          fi
