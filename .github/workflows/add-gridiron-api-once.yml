name: Add GridIron integration
on:
  push:
    branches: [feature/salary-csv-upload]
    paths:
      - '.github/workflows/add-gridiron-api-once.yml'
      - '.github/scripts/add_gridiron_api.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/add_gridiron_api.py
      - run: python -m py_compile dfs_app.py simmah_field_model.py
      - run: grep -q 'api.gridirondata.com/api/v1/projections' dfs_app.py
      - run: grep -q 'for position in ("QB", "RB", "WR", "TE")' dfs_app.py
      - run: grep -q 'External projection matches: GridIron' dfs_app.py
      - name: Commit app
        run: |
          git config user.name simmah-bot
          git config user.email simmah-bot@users.noreply.github.com
          git add dfs_app.py
          git commit -m 'Add corrected GridIron weekly projections [skip ci]' || exit 0
          git push origin HEAD:feature/salary-csv-upload
