name: Apply FanDuel SIM sanity diagnostics

on:
  push:
    branches:
      - feature/salary-csv-upload
    paths:
      - '.github/scripts/add_fd_sim_sanity.py'
      - '.github/workflows/apply-fd-sim-sanity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add FanDuel SIM sanity diagnostics
        run: python .github/scripts/add_fd_sim_sanity.py
      - name: Syntax check
        run: python -m py_compile dfs_app.py
      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dfs_app.py
          if git diff --cached --quiet; then
            echo "No app changes needed"
          else
            git commit -m "Show FanDuel field sanity check after SIM [skip ci]"
            git push origin HEAD:feature/salary-csv-upload
          fi
