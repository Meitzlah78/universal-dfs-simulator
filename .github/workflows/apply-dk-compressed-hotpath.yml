name: Apply DK Compressed Hotpath

on:
  push:
    branches:
      - refactor/dk-apply-compressed-hotpath
    paths:
      - '.github/workflows/apply-dk-compressed-hotpath.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dk-apply-compressed-hotpath
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: pip install numpy pandas pytest
      - name: Run parity tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_dk_showdown_engine.py tests/test_dk_weighted_field.py tests/test_dk_weighted_portfolio_parity.py tests/test_dk_unique_field_patch.py
      - name: Apply validated transforms
        run: |
          python .github/scripts/wire_dk_unique_field_indices.py
          python .github/scripts/wire_dk_unique_field_scoring.py
          python .github/scripts/wire_dk_weighted_rank_hotpath.py
          python -m py_compile dfs_app.py
      - name: Commit transformed app
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dfs_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Apply DK compressed field hotpath"
          git push origin HEAD:refactor/dk-apply-compressed-hotpath
