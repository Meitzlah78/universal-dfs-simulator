name: Fix shared PBP history once

on:
  push:
    branches:
      - feature/salary-csv-upload
    paths:
      - '.github/scripts/fix_shared_pbp_history.py'
      - '.github/workflows/fix-shared-pbp-history-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix shared PBP historical roles
        run: python .github/scripts/fix_shared_pbp_history.py
      - name: Syntax check
        run: python -m py_compile dfs_app.py
      - name: Verify shared PBP history wiring
        run: |
          grep -q '_matched_history = _fd_hist_index.get(_key)' dfs_app.py
          grep -q '_matched_history = _fd_hist_index.get(normalize_projection_player_name(_name))' dfs_app.py
          grep -q 'Shared NFL PBP role inputs' dfs_app.py
          grep -q 'platform="DraftKings"' dfs_app.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dfs_app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix shared NFL PBP historical roles [skip ci]"
          git push origin HEAD:feature/salary-csv-upload
