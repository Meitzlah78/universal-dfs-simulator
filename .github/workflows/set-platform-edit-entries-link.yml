name: Set platform edit entries link
on:
  push:
    paths:
      - '.github/scripts/set_platform_edit_entries_link.py'
      - '.github/workflows/set-platform-edit-entries-link.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
          fetch-depth: 0
      - run: python .github/scripts/set_platform_edit_entries_link.py
      - run: python -m py_compile dfs_app.py
      - run: |
          grep -q 'https://www.fanduel.com/upcoming' dfs_app.py
          grep -q 'https://www.draftkings.com/entry/upload' dfs_app.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dfs_app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use platform-specific edit entries link [skip ci]'
          git push origin HEAD:feature/salary-csv-upload
