name: Repair FD live matrix
on:
  push:
    paths: ['.github/workflows/repair-fd-live-matrix.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
          fetch-depth: 0
      - run: python .github/scripts/repair_fd_app_and_matrix.py
      - run: python -m py_compile dfs_app.py
      - run: |
          grep -q '_fd_diag_field_matrix = _fd_matrix_indices(opponent_df)' dfs_app.py
          grep -q '_field_scores += _row\[_fd_diag_field_matrix\[:, _slot_pos\]\]' dfs_app.py
          grep -q '_fd_field_matrix = _fd_matrix_indices(_fd_final_field)' dfs_app.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dfs_app.py
          git commit -m 'Repair FanDuel 50K diagnostic matrix [skip ci]'
          git push origin HEAD:feature/salary-csv-upload