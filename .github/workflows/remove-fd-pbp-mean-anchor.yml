name: Remove FanDuel PBP mean anchor
on:
  push:
    branches: [feature/salary-csv-upload]
    paths:
      - '.github/scripts/remove_fd_pbp_mean_anchor.py'
      - '.github/workflows/remove-fd-pbp-mean-anchor.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove remaining FanDuel mean anchor
        run: python .github/scripts/remove_fd_pbp_mean_anchor.py
      - name: Syntax check
        run: python -m py_compile dfs_app.py
      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dfs_app.py
          if git diff --cached --quiet; then
            echo "No app changes needed"
          else
            git commit -m "Remove remaining FanDuel PBP projection mean anchor [skip ci]"
            git push origin HEAD:feature/salary-csv-upload
          fi
