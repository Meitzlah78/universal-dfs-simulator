name: Test DK Showdown ROI invariants

on:
  push:
    branches: [refactor/dk-showdown-engine]
    paths:
      - 'dk_showdown_engine.py'
      - 'tests/test_dk_showdown_roi_invariants.py'
      - 'tests/test_dk_payout_hotpath.py'
      - 'tests/test_dk_weighted_field.py'
      - 'tests/test_dk_compressed_end_to_end.py'
      - '.github/workflows/test-dk-showdown-roi-invariants.yml'

jobs:
  roi-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dk-showdown-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pytest
      - name: Compile DK engine
        run: python -m py_compile dk_showdown_engine.py
      - name: Verify compressed field, duplicate ties, payouts and ROI accounting
        run: >-
          python -m pytest -q
          tests/test_dk_showdown_roi_invariants.py
          tests/test_dk_payout_hotpath.py
          tests/test_dk_weighted_field.py
          tests/test_dk_compressed_end_to_end.py
