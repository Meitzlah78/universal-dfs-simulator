name: Probe DFF FanDuel Single Game Route
on:
  push:
    branches: [feature/salary-csv-upload]
    paths: ['.github/workflows/probe-dff-fd-single-210bf.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe optimizer slate data references
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen
          import re, html
          url='https://www.dailyfantasyfuel.com/nfl?platform=fd&slate=21128'
          text=urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=30).read().decode('utf-8','ignore')
          print('bytes',len(text))
          for needle in ['21128','Trey Smack','Brandon Aubrey']:
            print('\nCONTEXT',needle)
            for m in list(re.finditer(re.escape(needle),text,re.I))[:8]:
              print(html.unescape(text[max(0,m.start()-500):m.end()+500]).replace('\n',' ')[:1100])
          print('\nDATA/API URL CANDIDATES')
          candidates=set(re.findall(r'''(?:https?:)?//[^\"'<> ]+|/[A-Za-z0-9_?&=./-]*(?:data|api|projection|slate)[A-Za-z0-9_?&=./-]*''',text,re.I))
          for c in sorted(candidates):
            if any(x in c.lower() for x in ['data','api','projection','slate']): print(html.unescape(c)[:500])
          print('\nSCRIPT SOURCES')
          for src in re.findall(r'<script[^>]+src=[\"\']([^\"\']+)',text,re.I): print(html.unescape(src))
          PY
