name: Test DK Index Matrix Fast

on:
  push:
    branches:
      - refactor/dk-index-matrix-fast
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas pytest
      - name: Apply vectorized index patch
        run: python .github/scripts/vectorize_dk_lineup_indices.py
      - name: Compile transformed app and engine
        run: python -m py_compile dfs_app.py dk_showdown_engine.py
      - name: Run DK engine parity tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_dk_showdown_engine.py
      - name: Verify old iterrows index builders are gone
        run: |
          ! grep -q 'for _, row in candidates_df.iterrows()' dfs_app.py
          ! grep -q 'for _, row in contest_field_df.iterrows()' dfs_app.py
          grep -q '_candidate_mapped.to_numpy(dtype=np.int16' dfs_app.py
          grep -q '_contest_mapped.to_numpy(dtype=np.int16' dfs_app.py
