name: Fix verified DFF FanDuel columns
on:
  workflow_dispatch:
  push:
    branches: [feature/salary-csv-upload]
    paths: ['.github/workflows/fix-dff-fd-verified-columns.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: feature/salary-csv-upload}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python .github/scripts/fix_dff_fd_verified_columns.py
      - run: python -m py_compile dfs_app.py
      - run: grep -Fq 'table.iloc[:, 2]' dfs_app.py
      - run: grep -Fq 'table.iloc[:, 7]' dfs_app.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add dfs_app.py
          git commit -m 'Use verified DFF FanDuel name and projection columns [skip ci]' || exit 0
          git push origin HEAD:feature/salary-csv-upload
