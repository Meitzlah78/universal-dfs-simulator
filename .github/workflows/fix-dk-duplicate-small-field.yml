name: Fix DK Duplicate Small Field

on:
  push:
    branches:
      - refactor/dk-showdown-engine
    paths:
      - .github/workflows/fix-dk-duplicate-small-field.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dk-showdown-engine
      - name: Apply bounded top-chalk count
        run: python .github/scripts/fix_dk_duplicate_small_field.py
      - name: Verify engine
        run: |
          python -m py_compile dk_showdown_engine.py
          python -m pip install -q numpy pandas pytest
          PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest -q tests/test_dk_showdown_engine.py
      - name: Commit fix
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add dk_showdown_engine.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix DK duplicate weights for small fields"
          git push origin HEAD:refactor/dk-showdown-engine
