name: Install DK Projected Dupes on live app

on:
  push:
    branches: [feature/salary-csv-upload]
    paths:
      - '.github/scripts/install_dk_projected_dupes_output.py'
      - '.github/workflows/install-dk-projected-dupes-live.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Projected Dupes transform
        run: python .github/scripts/install_dk_projected_dupes_output.py
      - name: Syntax check
        run: python -m py_compile dfs_app.py
      - name: Verify live export wiring
        run: |
          grep -q '"Projected Dupes"' dfs_app.py
          grep -q '_dupe_values = \[\]' dfs_app.py
          grep -q 'portfolio_export_df = portfolio_df\[' dfs_app.py
      - name: Commit live app change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dfs_app.py
          git diff --cached --quiet || git commit -m 'Expose Projected Dupes in live DK Showdown export [skip ci]'
          git push origin HEAD:feature/salary-csv-upload
