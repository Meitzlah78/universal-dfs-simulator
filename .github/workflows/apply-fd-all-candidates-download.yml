name: Apply FanDuel all-candidates download
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-fd-all-candidates-download.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply candidate download NameError fix
        run: python .github/scripts/add_fd_all_candidates_download.py
      - name: Syntax check
        run: python -m py_compile dfs_app.py
      - name: Commit patch
        run: |
          if git diff --quiet -- dfs_app.py; then
            echo 'No app changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dfs_app.py
          git commit -m 'Fix FanDuel all-candidates NameError [skip ci]'
          git push origin HEAD:feature/salary-csv-upload
