name: Apply DK Showdown history scoring optimization

on:
  push:
    branches:
      - feature/fd-full-roster
    paths:
      - '.github/scripts/optimize_dk_showdown_history_scoring.py'
      - '.github/workflows/apply-dk-showdown-history-scoring.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fd-full-roster
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply DK Showdown historical scoring patch
        run: python .github/scripts/optimize_dk_showdown_history_scoring.py
      - name: Syntax check
        run: python -m py_compile dfs_app.py nfl_stat_normalization.py
      - name: Unit test shared 2PT normalization
        run: python -m unittest tests/test_nfl_stat_normalization.py
      - name: Commit optimized DK history scoring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dfs_app.py
          if git diff --cached --quiet; then
            echo "No app changes needed"
          else
            git commit -m "Rebuild DK Showdown history from raw NFL stats [skip ci]"
            git push origin HEAD:feature/fd-full-roster
          fi
