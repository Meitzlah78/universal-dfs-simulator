name: Fix Classic simulation metrics once
on:
  push:
    branches: [feature/salary-csv-upload]
    paths: [.github/workflows/fix-classic-sim-metrics-once.yml]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Classic metric fix
        run: python .github/scripts/fix_classic_sim_metrics.py
      - name: Syntax check
        run: python -m py_compile dfs_app.py
      - name: Verify metrics use simulated ranks
        run: |
          grep -q '_top1_hits' dfs_app.py
          grep -q '_cash_rank' dfs_app.py
          grep -q 'user_lineups\["CashRate"\] = _cash_hits / _denom' dfs_app.py
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dfs_app.py
          git commit -m 'Fix Classic finish rates from simulated ranks [skip ci]' || exit 0
          git push origin HEAD:feature/salary-csv-upload
