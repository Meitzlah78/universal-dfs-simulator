name: Fix FanDuel Player Pool simulation source

on:
  push:
    branches:
      - feature/salary-csv-upload
    paths:
      - '.github/scripts/fix_fd_player_pool_source.py'
      - '.github/workflows/fix-fd-player-pool-source.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply FanDuel Player Pool source fix
        run: python .github/scripts/fix_fd_player_pool_source.py
      - name: Syntax check
        run: python -m py_compile dfs_app.py
      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dfs_app.py
          if git diff --cached --quiet; then
            echo "No app changes needed"
          else
            git commit -m "Fix FanDuel Player Pool simulation source [skip ci]"
            git push origin HEAD:feature/salary-csv-upload
          fi
