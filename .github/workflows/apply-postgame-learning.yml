name: Apply SIMMAH Updates

on:
  push:
    branches:
      - feature/salary-csv-upload
    paths:
      - '.github/scripts/add_full_roster_stacks.py'
      - '.github/scripts/add_single_game_ownership_field.py'
      - '.github/scripts/add_single_game_field_columns.py'
      - '.github/scripts/standardize_sim_layout.py'
      - '.github/workflows/apply-postgame-learning.yml'

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply full-roster stack controls patch
        run: python .github/scripts/add_full_roster_stacks.py

      - name: Apply single-game ownership field patch
        run: python .github/scripts/add_single_game_ownership_field.py

      - name: Apply single-game field columns patch
        run: python .github/scripts/add_single_game_field_columns.py

      - name: Standardize SIM layout
        run: python .github/scripts/standardize_sim_layout.py

      - name: Syntax check
        run: python -m py_compile dfs_app.py

      - name: Commit patched app
        run: |
          if git diff --quiet -- dfs_app.py; then
            echo "No app changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dfs_app.py
          git commit -m "Standardize Player Pool-first SIM layout [skip ci]"
          git push origin HEAD:feature/salary-csv-upload
