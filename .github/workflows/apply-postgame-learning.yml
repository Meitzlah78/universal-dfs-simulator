name: Apply SIMMAH Updates

on:
  push:
    branches:
      - feature/salary-csv-upload
    paths:
      - '.github/scripts/unify_fd_sim_engine.py'
      - '.github/scripts/add_fd_role_ownership_field.py'
      - '.github/workflows/apply-postgame-learning.yml'

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Share historical/PBP simulation engine across DK and FD
        run: python .github/scripts/unify_fd_sim_engine.py

      - name: Add FanDuel MVP/FLEX ownership weighting
        run: python .github/scripts/add_fd_role_ownership_field.py

      - name: Syntax check
        run: python -m py_compile dfs_app.py

      - name: Commit patched app
        run: |
          if git diff --quiet -- dfs_app.py; then
            echo "No app changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dfs_app.py
          git commit -m "Separate FanDuel MVP and FLEX ownership weighting [skip ci]"
          git push origin HEAD:feature/salary-csv-upload
