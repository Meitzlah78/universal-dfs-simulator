name: Apply Post-Game Learning

on:
  push:
    branches:
      - feature/salary-csv-upload
    paths:
      - '.github/scripts/add_postgame_learning.py'
      - '.github/scripts/add_one_upload_slate_setup.py'
      - '.github/scripts/add_auto_contest_size.py'
      - '.github/workflows/apply-postgame-learning.yml'

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply post-game learning patch
        run: python .github/scripts/add_postgame_learning.py

      - name: Apply one-upload slate setup patch
        run: python .github/scripts/add_one_upload_slate_setup.py

      - name: Apply automatic contest size patch
        run: python .github/scripts/add_auto_contest_size.py

      - name: Syntax check
        run: python -m py_compile dfs_app.py

      - name: Commit patched app
        run: |
          if git diff --quiet -- dfs_app.py; then
            echo "No app changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dfs_app.py
          git commit -m "Apply SIMMAH slate and learning updates [skip ci]"
          git push origin HEAD:feature/salary-csv-upload
