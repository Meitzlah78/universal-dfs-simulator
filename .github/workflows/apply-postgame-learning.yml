name: Apply SIMMAH Updates

on:
  push:
    branches:
      - feature/salary-csv-upload
    paths:
      - '.github/scripts/unify_fd_sim_engine.py'
      - '.github/scripts/add_fd_role_ownership_field.py'
      - '.github/scripts/remove_dead_duplicate_sim_engine.py'
      - '.github/scripts/use_local_pbp_archive.py'
      - '.github/scripts/fix_dk_contest_field_size.py'
      - '.github/scripts/harden_dk_replacement_export.py'
      - '.github/scripts/rename_dk_edit_entries_button.py'
      - '.github/scripts/move_step4_below_step3.py'
      - '.github/scripts/show_all_dk_players.py'
      - '.github/workflows/apply-postgame-learning.yml'

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Share historical/PBP simulation engine across DK and FD
        run: python .github/scripts/unify_fd_sim_engine.py

      - name: Add FanDuel MVP/FLEX ownership weighting
        run: python .github/scripts/add_fd_role_ownership_field.py

      - name: Remove dead duplicate simulation engine
        run: python .github/scripts/remove_dead_duplicate_sim_engine.py

      - name: Prefer saved repo PBP archives before nflverse
        run: python .github/scripts/use_local_pbp_archive.py

      - name: Correct DraftKings pregame contest field size
        run: python .github/scripts/fix_dk_contest_field_size.py

      - name: Harden DraftKings reserved-entry replacement export
        run: python .github/scripts/harden_dk_replacement_export.py

      - name: Point top DraftKings button to Edit Entries
        run: python .github/scripts/rename_dk_edit_entries_button.py

      - name: Keep Step 4 directly below Step 3
        run: python .github/scripts/move_step4_below_step3.py

      - name: Keep every DraftKings salary-file player visible
        run: python .github/scripts/show_all_dk_players.py

      - name: Syntax check
        run: python -m py_compile dfs_app.py

      - name: Commit patched app
        run: |
          if git diff --quiet -- dfs_app.py; then
            echo "No app changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dfs_app.py
          git commit -m "Show all DraftKings salary players [skip ci]"
          git push origin HEAD:feature/salary-csv-upload
