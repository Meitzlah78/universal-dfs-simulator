name: Test DK Weighted Field

on:
  push:
    branches:
      - refactor/dk-weighted-field-core
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weighted-field:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pytest
      - name: Run weighted field parity tests
        run: python -m pytest -q tests/test_dk_weighted_field.py
