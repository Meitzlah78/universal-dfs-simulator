name: Apply field sanity check
on:
  push:
    paths: ['.github/scripts/add_field_sanity_check.py']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
      - run: python .github/scripts/add_field_sanity_check.py
      - run: python -m py_compile dfs_app.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dfs_app.py
          git diff --cached --quiet || (git commit -m 'Add Contest Sim field sanity check' && git push origin HEAD:feature/salary-csv-upload)
