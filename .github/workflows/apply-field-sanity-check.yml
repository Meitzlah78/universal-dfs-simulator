name: Apply Contest Sim diagnostics
on:
  push:
    paths:
      - '.github/scripts/add_field_sanity_check.py'
      - '.github/scripts/strengthen_showdown_opponents.py'
      - '.github/scripts/revert_showdown_strength_and_add_holdout_check.py'
      - '.github/scripts/set_showdown_opponent_min_salary_45000.py'
      - '.github/workflows/apply-field-sanity-check.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
      - name: Apply field sanity check
        run: python .github/scripts/add_field_sanity_check.py
      - name: Apply latest Showdown diagnostic
        run: python .github/scripts/revert_showdown_strength_and_add_holdout_check.py
      - name: Set Showdown opponent minimum salary
        run: python .github/scripts/set_showdown_opponent_min_salary_45000.py
      - name: Syntax check
        run: python -m py_compile dfs_app.py
      - name: Commit app changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dfs_app.py
          if ! git diff --cached --quiet; then
            git commit -m "Apply Contest Sim diagnostics"
            git push origin HEAD:feature/salary-csv-upload
          fi
