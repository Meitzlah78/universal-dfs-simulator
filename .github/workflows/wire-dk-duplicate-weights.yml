name: Wire DK Duplicate Weights

on:
  push:
    branches:
      - refactor/dk-showdown-engine
    paths:
      - .github/workflows/wire-dk-duplicate-weights.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dk-showdown-engine
      - name: Patch duplicate weights
        run: python .github/scripts/wire_dk_duplicate_weights.py
      - name: Verify
        run: |
          python -m py_compile dfs_app.py dk_showdown_engine.py
          python -m pip install -q numpy pandas pytest
          PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest -q tests/test_dk_showdown_engine.py
          grep -q 'duplicate_expansion_weights as dk_duplicate_expansion_weights' dfs_app.py
          grep -q 'weights = dk_duplicate_expansion_weights(log_weights)' dfs_app.py
      - name: Commit
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add dfs_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Wire DK duplicate weights to engine"
          git push origin HEAD:refactor/dk-showdown-engine
