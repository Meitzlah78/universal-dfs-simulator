name: Apply FanDuel feature updates

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-fd-feature-updates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply FanDuel setup
        run: python .github/scripts/make_fd_full_roster_setup.py
      - name: Wire FanDuel Player Pool to PBP simulation
        run: python .github/scripts/fix_fd_player_pool_source.py
      - name: Refresh FanDuel Player Pool after SIM
        run: python .github/scripts/fix_fd_player_pool_refresh.py
      - name: Apply editable injury status and column order
        run: python .github/scripts/fix_fd_editable_injury_and_columns.py
      - name: Show FanDuel contest metrics after SIM
        run: python .github/scripts/show_fd_contest_metrics.py
      - name: Syntax check
        run: python -m py_compile dfs_app.py
      - name: Commit patched feature app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dfs_app.py
          if git diff --cached --quiet; then
            echo "No app changes needed"
          else
            git commit -m "Apply FanDuel feature updates [skip ci]"
            git push origin HEAD:feature/salary-csv-upload
          fi
