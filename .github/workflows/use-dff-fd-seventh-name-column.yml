name: Use DFF FD seventh name column
on:
  workflow_dispatch:
  push:
    branches: [feature/salary-csv-upload]
    paths:
      - '.github/workflows/use-dff-fd-seventh-name-column.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/use_dff_fd_seventh_name_column.py
      - run: python -m py_compile dfs_app.py
      - run: grep -q 'name_col = table.columns\[6\]' dfs_app.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add dfs_app.py
          git commit -m 'Use DFF FanDuel seventh displayed column for names [skip ci]' || exit 0
          git push origin HEAD:feature/salary-csv-upload
