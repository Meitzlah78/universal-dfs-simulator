name: Apply fast FD Full Roster builder test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/install/fast-fd-full-roster-test-2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: install/fast-fd-full-roster-test-2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply installer
        run: python .github/scripts/install_fast_fd_full_roster_builder.py
      - name: Syntax check
        run: python -m py_compile dfs_app.py .github/scripts/install_fast_fd_full_roster_builder.py
      - name: Run focused tests
        run: python -m pytest -q tests/test_fast_fd_full_roster_installer.py tests/test_fast_build_architecture.py tests/test_opponent_field_architecture.py
      - name: Commit patched app
        run: |
          if git diff --quiet -- dfs_app.py; then
            echo "No dfs_app.py changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dfs_app.py
          git commit -m "Apply FD Full Roster fast-builder optimization"
          git push origin HEAD:install/fast-fd-full-roster-test-2
