name: Apply fast FD Full Roster builder test

on:
  workflow_dispatch:
  push:
    branches:
      - install/fast-fd-full-roster-test-2
    paths:
      - .github/triggers/apply-fast-fd-full-roster-test

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/install/fast-fd-full-roster-test-2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: install/fast-fd-full-roster-test-2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pre-patch anchors
        run: python -m pytest -q tests/test_fast_fd_full_roster_installer.py
      - name: Apply installer
        run: python .github/scripts/install_fast_fd_full_roster_builder.py
      - name: Syntax check
        run: python -m py_compile dfs_app.py .github/scripts/install_fast_fd_full_roster_builder.py
      - name: Verify transformed hot loop
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('dfs_app.py').read_text(encoding='utf-8')
          required = [
              'np.isin(base_choices',
              'projected_salary = salary + salaries[choices]',
              'fd_build_name_to_index.get(qb_name)',
              'fd_build_teams[choices] == qb_team',
          ]
          missing = [token for token in required if token not in app]
          if missing:
              raise SystemExit(f'Missing transformed anchors: {missing}')
          PY
      - name: Run architecture tests
        run: python -m pytest -q tests/test_fast_build_architecture.py tests/test_opponent_field_architecture.py
      - name: Commit patched app
        run: |
          if git diff --quiet -- dfs_app.py; then
            echo "No dfs_app.py changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dfs_app.py
          git commit -m "Apply FD Full Roster fast-builder optimization"
          git push origin HEAD:install/fast-fd-full-roster-test-2
