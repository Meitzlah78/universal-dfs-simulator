name: Apply FanDuel opponent salary separation
on:
  push:
    branches: [feature/salary-csv-upload]
    paths:
      - '.github/scripts/separate_fd_opponent_salary.py'
      - '.github/workflows/fix-fd-contest-metric-truth.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/separate_fd_opponent_salary.py
      - run: python -m py_compile dfs_app.py
      - name: Commit patch
        run: |
          if git diff --quiet -- dfs_app.py; then
            echo 'No app changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dfs_app.py
          git commit -m 'Separate FanDuel opponent salary floor [skip ci]'
          git push origin HEAD:feature/salary-csv-upload
