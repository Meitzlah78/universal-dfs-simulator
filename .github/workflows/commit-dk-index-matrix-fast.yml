name: Commit DK Index Matrix Fast

on:
  push:
    branches:
      - refactor/dk-index-matrix-fast
    paths:
      - .github/workflows/commit-dk-index-matrix-fast.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit-index-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas pytest
      - name: Apply validated index patch
        run: python .github/scripts/vectorize_dk_lineup_indices.py
      - name: Compile app and engine
        run: python -m py_compile dfs_app.py dk_showdown_engine.py
      - name: Run DK parity tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_dk_showdown_engine.py
      - name: Verify vectorized index construction
        run: |
          ! grep -q 'for _, row in candidates_df.iterrows()' dfs_app.py
          ! grep -q 'for _, row in contest_field_df.iterrows()' dfs_app.py
          grep -q '_candidate_mapped.to_numpy(dtype=np.int16' dfs_app.py
          grep -q '_contest_mapped.to_numpy(dtype=np.int16' dfs_app.py
      - name: Commit transformed app
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add dfs_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Vectorize DK lineup index matrices [skip ci]"
          git push origin HEAD:refactor/dk-index-matrix-fast
