name: Optimize DK Candidate Ownership Lookup

on:
  push:
    branches:
      - refactor/dk-showdown-engine
    paths:
      - .github/workflows/optimize-dk-candidate-ownership.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dk-showdown-engine
      - name: Patch ownership lookup
        run: python .github/scripts/optimize_dk_candidate_ownership.py
      - name: Verify
        run: |
          python -m py_compile dfs_app.py dk_showdown_engine.py
          python -m pip install -q numpy pandas pytest
          PYTHONPATH="$GITHUB_WORKSPACE" python -m pytest -q tests/test_dk_showdown_engine.py
          grep -q 'showdown_ownership_by_name = {' dfs_app.py
          grep -q '                    showdown_ownership_by_name,' dfs_app.py
      - name: Commit
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add dfs_app.py
          git diff --cached --quiet && exit 0
          git commit -m "Optimize DK Showdown candidate ownership lookup [skip ci]"
          git push origin HEAD:refactor/dk-showdown-engine
