name: Test DK Vector Candidate Filters

on:
  push:
    branches:
      - refactor/dk-vector-candidate-filters
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas pytest
      - name: Apply candidate filter transform
        run: python .github/scripts/vectorize_dk_candidate_filters.py
      - name: Compile transformed app
        run: python -m py_compile dfs_app.py dk_showdown_engine.py
      - name: Verify vectorized filter markers
        run: |
          grep -q 'batch_valid = (batch_salary' dfs_app.py
          grep -q 'sampled_indices = sampled_indices\[batch_valid\]' dfs_app.py
      - name: Run DK parity tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python -m pytest -q
          tests/test_dk_showdown_engine.py
          tests/test_dk_weighted_field.py
          tests/test_dk_weighted_portfolio_parity.py
          tests/test_dk_compressed_end_to_end.py
          tests/test_dk_payout_hotpath.py
      - name: Run candidate filter parity benchmark
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python benchmarks/benchmark_dk_candidate_filters.py
