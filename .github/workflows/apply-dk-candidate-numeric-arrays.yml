name: Apply DK Candidate Numeric Arrays

on:
  push:
    branches:
      - refactor/dk-showdown-engine
    paths:
      - '.github/workflows/apply-dk-candidate-numeric-arrays.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dk-showdown-engine
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas pytest
      - name: Apply benchmarked DK scoring batch size
        run: python .github/scripts/set_dk_scoring_batch_64.py
      - name: Verify and compile transformed app
        run: |
          grep -q 'batch_size = 64 if is_dk_showdown else 128' dfs_app.py
          python -m py_compile dfs_app.py dk_showdown_engine.py
      - name: Run DK parity tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python -m pytest -q
          tests/test_dk_showdown_engine.py
          tests/test_dk_weighted_field.py
          tests/test_dk_weighted_portfolio_parity.py
          tests/test_dk_compressed_end_to_end.py
          tests/test_dk_payout_hotpath.py
      - name: Commit transformed app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dfs_app.py
          if git diff --cached --quiet; then
            echo 'No app changes to commit.'
          else
            git commit -m 'Use 64-scenario DK Showdown scoring batches'
            git push origin HEAD:refactor/dk-showdown-engine
          fi
