name: Integrate fast builders

on:
  push:
    branches:
      - feature/fast-build-all-modes
    paths:
      - .github/workflows/integrate-fast-builders.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/fast-build-all-modes
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pandas

      - name: Apply DK Classic fast builder
        run: python .github/scripts/install_fast_classic_builder.py

      - name: Apply shared FanDuel build setup
        run: python .github/scripts/install_fast_fd_build_setup.py

      - name: Apply FanDuel Single Game fast builder
        run: python .github/scripts/install_fast_fd_single_game_builder.py

      - name: Apply FanDuel Full Roster fast builder
        run: python .github/scripts/install_fast_fd_full_roster_builder.py

      - name: Apply cached Full Roster stack validation
        run: python .github/scripts/install_fast_stack_validation.py

      - name: Compile integrated app
        run: python -m py_compile dfs_app.py

      - name: Run cross-mode fast-builder tests
        run: pytest -q tests/test_fast_build_architecture.py tests/test_fast_build_installers.py tests/test_fast_fd_single_game_installer.py tests/test_fast_fd_full_roster_installer.py tests/test_opponent_field_architecture.py

      - name: Commit validated integrated implementation
        run: |
          if git diff --quiet -- dfs_app.py; then
            echo 'No dfs_app.py changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dfs_app.py
          git commit -m 'Integrate validated fast builders across DFS modes'
          git push origin HEAD:feature/fast-build-all-modes
