name: Add contest history upload UI once
on:
  push:
    branches: [feature/salary-csv-upload]
    paths:
      - '.github/scripts/add_contest_history_ui.py'
      - '.github/workflows/add-contest-history-ui-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/salary-csv-upload
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/add_contest_history_ui.py
      - run: python -m py_compile dfs_app.py simmah_field_model.py
      - run: grep -q 'Contest History / Field Learning' dfs_app.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dfs_app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add contest history field-learning upload [skip ci]'
          git push origin HEAD:feature/salary-csv-upload
